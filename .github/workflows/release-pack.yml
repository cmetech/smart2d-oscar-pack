name: Release Pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release_pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and publish pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./pack-tools/release-pack-github.sh "$GITHUB_REF_NAME"
